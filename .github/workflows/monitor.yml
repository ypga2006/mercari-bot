name: Mercari Monitor

on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 실행
  workflow_dispatch: # 수동 실행 허용

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 👈 캐시 파일을 저장(commit)해야 하므로 write 권한으로 변경합니다.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # 👈 Git 인증을 허용하여 캐시 자동 저장

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python mercari_bot.py

      - name: Commit and push cache if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_item_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update item cache [skip ci]" && git push)
